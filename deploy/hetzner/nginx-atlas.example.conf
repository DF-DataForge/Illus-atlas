# Example for atlas.example.com. Install after obtaining the TLS certificate;
# see DEPLOY.md for the temporary HTTP-only ACME bootstrap configuration.
upstream illus_atlas_app {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    # Enable these only when IPv6 is configured on the host and in Hetzner:
    # listen [::]:80;
    server_name atlas.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # Enable this only when IPv6 is configured on the host and in Hetzner:
    # listen [::]:443 ssl;
    http2 on;
    server_name atlas.example.com;

    ssl_certificate /etc/letsencrypt/live/atlas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # Shared reverse-proxy headers/timeouts for the permitted API and UI.
    # The 60-second read timeout allows the 6-second geocoding budget plus Odoo.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 60s;

    # These are the only API endpoints exposed through this public virtual host.
    location = /api/sales-points {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        add_header Allow "GET, HEAD" always;
        proxy_pass http://illus_atlas_app;
    }

    location = /api/health {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        add_header Allow "GET, HEAD" always;
        proxy_pass http://illus_atlas_app;
    }

    # Regex matching is case-insensitive so Express's case-insensitive routing
    # cannot expose differently-cased aliases through the UI proxy below.
    # Exact lowercase allowlisted locations above take precedence.
    location ~* ^/api(?:/|$) {
        return 404;
    }

    # Keep this as a normal prefix location (not ^~) so the API deny regex runs.
    location / {
        proxy_pass http://illus_atlas_app;
    }
}